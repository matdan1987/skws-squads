<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKWS – Skywalkers · Squads</title>
<meta name="theme-color" content="#070b14">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/index.css?v=35">
<link rel="stylesheet" href="css/stil-fx.css?v=1">
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="img/skws-emblem.jpg" alt="SKWS">
    <div class="htxt"><div class="a" id="allianceName">SKWS – Skywalkers</div><h1 data-t="title">Squads</h1></div>
    <a href="admin.html" id="hdrAdmin" class="hdr-admin hide" title="Admin">🔒</a>
    <select id="lang" aria-label="Language"></select>
  </header>

  <div id="loading" class="loading"><div class="spin"></div><span id="loadingTxt">…</span></div>

  <div id="app" class="hide">
    <div class="tabs">
      <button id="tabForm" class="on" data-t="form"></button>
      <button id="tabEvents"></button>
      <button id="tabOverview" data-t="overview"></button>
      <button id="tabProfile"></button>
      <button id="tabFunk"></button>
    </div>

    <!-- Formular -->
    <section id="formView">
      <div class="card">
        <p class="intro" id="introTxt" data-t="intro"></p>
        <label class="l" for="name" id="nameLbl" data-t="name"></label>
        <div id="pickBox">
          <input id="search" type="search" data-tp="search" autocomplete="off" style="margin-bottom:8px">
          <select id="name"></select>
          <div class="hint hide" id="nameSaved" style="color:var(--ok)">✓ <span data-t="nameSaved"></span></div>
          <div id="authBox" class="authbox"></div>
          <div id="newWrap">
            <div class="hint" data-t="notListed"></div>
            <button type="button" id="newBtn" class="linkbtn" data-t="newBtn"></button>
          </div>
        </div>
        <div id="newBox" class="hide">
          <input id="newName" type="text" maxlength="40" autocomplete="off" data-tp="newName">
          <div class="hint" data-t="newNameHint"></div>
          <div class="hint fk-first" id="newPinHint"></div>
          <input id="newPin" type="password" autocomplete="new-password" maxlength="32">
          <input id="newPin2" type="password" autocomplete="new-password" maxlength="32" style="margin-top:8px">
          <button type="button" id="backBtn" class="linkbtn" data-t="backToList"></button>
        </div>
        <a href="admin.html" id="adminBtn" class="hide" style="display:block;margin-top:10px;text-align:center;border:1px solid rgba(92,200,255,.45);color:var(--accent);border-radius:10px;padding:10px;text-decoration:none;font-weight:600;font-size:14px">🔒 <span data-t="adminBtn"></span></a>
        <div class="meta hide" id="lastUpdate"></div>
      </div>

      <div class="card hide" id="weekCard"><div class="sq-h"><b id="weekTitle"></b></div><div id="weekList"></div></div>

      <div id="squads"></div>

      <div class="card">
        <div class="sq-h"><b data-t="heroTitle"></b><span class="tag req" data-t="required"></span></div>
        <div><label class="l" for="hero" data-t="heroPower"></label><input id="hero" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="hint" data-t="heroHint"></div>
        <div class="row" style="margin-top:12px">
          <div><label class="l" for="gstage" data-t="gstage"></label><input id="gstage" type="text" inputmode="numeric" autocomplete="off" placeholder="3"></div>
          <div><label class="l" for="gorilla" data-t="gorilla"></label><input id="gorilla" type="text" inputmode="numeric" autocomplete="off" placeholder="23"></div>
        </div>
        <div style="margin-top:10px"><label class="l" for="gpower" data-t="gpower"></label><input id="gpower" type="text" inputmode="numeric" autocomplete="off" placeholder="2355342"></div>
        <div class="hint" data-t="gHint"></div>
      </div>

      <div class="card">
        <div class="sq-h"><label class="l" for="email" data-t="emailTitle" style="margin:0"></label><span class="tag req" data-t="required"></span></div>
        <div id="emailActive" class="ok-pill hide">● <span data-t="emailSaved"></span></div>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
        <div class="hint" data-t="emailHint"></div>
      </div>

      <div class="card hide" id="appRemCard">
        <label class="l" data-t="appRemTitle"></label>
        <label class="chk" style="margin-top:0;color:var(--text)"><input type="checkbox" id="appRem"><span data-t="appRemOn"></span></label>
        <div class="hint" data-t="appRemHint"></div>
        <div class="hint" id="appRemMsg" style="color:var(--warn)"></div>
        <button type="button" id="appRemTest" style="margin-top:10px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer" data-t="appRemTest"></button>
      </div>

      <div class="card hide" id="linksCard">
        <label class="l" data-t="linksTitle"></label>
        <div class="lnk"><div class="hint" data-t="linkPublic"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/" data-t="copy"></button></div></div>
        <div class="lnk hide" id="linkAdminBox"><div class="hint" data-t="linkAdmin"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/admin.html</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/admin.html" data-t="copy"></button></div></div>
      </div>

      <button class="btn" id="save" data-t="save"></button>
      <div class="msg" id="msg"></div>
    </section>

    <!-- Übersicht -->
    <!-- Events: Anmeldung, eigener Einsatz, „Warst du dabei?“ -->
    <section id="eventsView" class="hide">
      <div class="hint ev-intro" id="evIntro"></div>
      <div id="calBox"></div>
      <div id="pollBox"></div>
      <div id="evCards"></div>
      <div class="card hide" id="dsCard">
        <div class="sq-h"><b id="dsTitle"></b><span class="tag req" id="dsTeam"></span></div>
        <div class="hint" id="dsMeta" style="margin-top:0"></div>
        <ol id="dsSteps" class="dssteps"></ol>
        <div class="hint" id="dsWith"></div>
        <button type="button" class="ghost plan-btn hide" id="dsPicBtn"></button>
        <div class="plan-pic" id="dsPic"></div>
      </div>

      <div class="card hide" id="csCard">
        <div class="sq-h"><b id="csTitle"></b><span class="tag req" id="csTeam"></span></div>
        <div class="hint" id="csMeta" style="margin-top:0"></div>
        <ol id="csSteps" class="dssteps"></ol>
        <div class="hint" id="csWith"></div>
        <button type="button" class="ghost plan-btn hide" id="csPicBtn"></button>
        <div class="plan-pic" id="csPic"></div>
      </div>

      <div id="claimCards"></div>
      <div class="card hide" id="evEmpty"><div class="hint" id="evEmptyTxt" style="margin:0"></div></div>
    </section>

    <section id="profileView" class="hide">
      <div id="profBox"></div>
      <div class="card hide" id="merCard"><div class="sq-h"><b id="merTitle"></b></div><div id="merList"></div><div class="hint" id="merHint"></div></div>
    </section>

    <section id="funkView" class="hide">
      <div id="funkBox"></div>
      <div id="helpBox"></div>
    </section>

    <section id="overviewView" class="hide">
      <div id="vsBox"></div>
      <div class="card hide" id="hofCard"><div class="sq-h"><b id="hofTitle"></b><span class="tag req">🏆</span></div><div id="hofBox"></div></div>
      <div class="card">
        <div class="stat"><b id="statTxt"></b><div class="bar"><i id="statBar" style="width:0"></i></div></div>
        <div class="hint" id="ovHint"></div>
        <input id="ovSearch" type="search" autocomplete="off" style="margin-top:10px">
      </div>
      <div class="card" style="padding:8px 12px">
        <table>
          <thead><tr><th>#</th><th data-t="colName"></th><th class="n">T1</th><th class="n" data-t="total"></th></tr></thead>
          <tbody id="ovBody"></tbody>
        </table>
      </div>
      <div class="card" id="missingCard">
        <label class="l" data-t="missing"></label>
        <div class="chips" id="missingList"></div>
      </div>
    </section>
  </div>
  <p style="text-align:center;margin-top:28px"><a href="admin.html" style="color:var(--muted);font-size:12px;text-decoration:none">🔒 Admin (R4/R5)</a></p>
</div>

<div id="fkModal" class="fk-overlay hide"></div>
<script src="js/demo.js?v=13"></script>
<script src="js/index-texte.js?v=21"></script>
<script src="js/index-funk-texte.js?v=23"></script>
<script src="js/index-zentral.js?v=1"></script>
<script src="js/index-funk.js?v=21"></script>
<script src="js/index-neu.js?v=20"></script>
<script src="js/index-umfragen.js?v=1"></script>
<script src="js/index-mehr.js?v=3"></script>
<script src="js/index-stilfx.js?v=1"></script>
<script src="js/index-stil.js?v=8"></script>
<script src="js/klapp.js?v=19"></script>
<script src="js/zuschnitt.js?v=19"></script>
<script src="js/index.js?v=39"></script>
</body>
</html>
