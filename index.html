<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKWS – Skywalkers · Squads</title>
<meta name="theme-color" content="#070b14">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#070b14; --bg2:#0d1424; --card:#111a2e; --line:#1f2b45; --text:#e6edf7; --muted:#8a9bb8;
    --accent:#5cc8ff; --accent2:#7c5cff; --ok:#3ddc97; --err:#ff6b6b;
    --tank:#3987e5; --missile:#d95926; --aircraft:#9085e9; --mixed:#199e70;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{background:radial-gradient(1200px 500px at 50% -200px,#1a2a55 0%,transparent 70%),var(--bg);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:11px;letter-spacing:.02em;color:#06101f}
  .htxt{flex:1;min-width:0}
  .htxt .a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .htxt h1{margin:0;font-size:20px;font-weight:700}
  select,input{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,200,255,.15)}
  #lang{width:auto;padding:8px 30px 8px 10px;font-size:13px}
  .tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .intro{color:var(--muted);margin:0 0 12px}
  label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sq-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sq-h b{font-size:16px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .tag.req{border-color:rgba(92,200,255,.5);color:var(--accent)}
  .sq.opt{opacity:.92}
  .sq[data-type="tank"]{border-left:3px solid var(--tank)}
  .sq[data-type="missile"]{border-left:3px solid var(--missile)}
  .sq[data-type="aircraft"]{border-left:3px solid var(--aircraft)}
  .sq[data-type="mixed"]{border-left:3px solid var(--mixed)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .lnk{margin-top:8px}
  .lnkrow{display:flex;gap:8px;align-items:center;margin-top:4px}
  .lnkrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .cpy{flex:none;background:var(--bg2);border:1px solid rgba(92,200,255,.45);color:var(--accent);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .evopt{display:block;width:100%;text-align:left;margin-top:6px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer}
  .evopt.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(92,200,255,.25);font-weight:700}
  .evopt:disabled{opacity:.55;cursor:default}
  .prof-h{display:flex;align-items:center;gap:12px}
  .prof-av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none}
  .prof-h b{font-size:18px;display:block}
  .lvl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .lvl > div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .lvl .big{font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px}
  .lvl .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
  .lvl .bar i{display:block;height:100%;border-radius:99px}
  .stk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .stk span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2px solid;cursor:pointer;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .stk span.b{background:#3b2f05;border-color:#f5c518} .stk span.d{background:#3a0b14;border-color:#ff6b6b;transform:rotate(6deg)}
  .stk span.old{opacity:.35;filter:grayscale(.7)}
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
  .achv{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .achv .ic{width:48px;height:48px;margin:0 auto 6px;border-radius:12px;display:grid;place-items:center;font-size:26px;border:3px solid var(--line)}
  .achv.t1 .ic{border-color:#cd7f32} .achv.t2 .ic{border-color:#c0c7d1} .achv.t3 .ic{border-color:#f5c518;box-shadow:0 0 12px rgba(245,197,24,.45)}
  .achv.lock{opacity:.45} .achv.lock .ic{filter:grayscale(1)}
  .achv b{display:block;font-size:13px} .achv small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .achv .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden} .achv .bar i{display:block;height:100%;background:var(--accent)}
  .dssteps{margin:8px 0 0;padding-left:20px}
  .dssteps li{margin:6px 0}
  .dssteps li b{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .linkbtn{display:block;width:100%;margin-top:10px;background:var(--bg2);border:1px dashed var(--line);color:var(--accent);border-radius:10px;padding:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .meta{font-size:13px;color:var(--muted);margin:8px 0 0}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
  .chk input{width:18px;height:18px;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto}
  .ok-pill{display:inline-block;font-size:12px;color:var(--ok);margin-bottom:8px}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:#06101f;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{min-height:22px;margin-top:10px;text-align:center;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .hide{display:none!important}
  .stat{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .typ{font-size:12px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SKWS</div>
    <div class="htxt"><div class="a" id="allianceName">SKWS – Skywalkers</div><h1 data-t="title">Squads</h1></div>
    <select id="lang" aria-label="Language"></select>
  </header>

  <div id="loading" class="loading"><div class="spin"></div><span id="loadingTxt">…</span></div>

  <div id="app" class="hide">
    <div class="tabs">
      <button id="tabForm" class="on" data-t="form"></button>
      <button id="tabOverview" data-t="overview"></button>
      <button id="tabProfile"></button>
    </div>

    <!-- Formular -->
    <section id="formView">
      <div class="card">
        <p class="intro" data-t="intro"></p>
        <label class="l" for="name" data-t="name"></label>
        <div id="pickBox">
          <input id="search" type="search" data-tp="search" autocomplete="off" style="margin-bottom:8px">
          <select id="name"></select>
          <div class="hint hide" id="nameSaved" style="color:var(--ok)">✓ <span data-t="nameSaved"></span></div>
          <div class="hint" data-t="notListed"></div>
          <button type="button" id="newBtn" class="linkbtn" data-t="newBtn"></button>
        </div>
        <div id="newBox" class="hide">
          <input id="newName" type="text" maxlength="40" autocomplete="off" data-tp="newName">
          <div class="hint" data-t="newNameHint"></div>
          <button type="button" id="backBtn" class="linkbtn" data-t="backToList"></button>
        </div>
        <a href="admin.html" id="adminBtn" class="hide" style="display:block;margin-top:10px;text-align:center;border:1px solid rgba(92,200,255,.45);color:var(--accent);border-radius:10px;padding:10px;text-decoration:none;font-weight:600;font-size:14px">🔒 <span data-t="adminBtn"></span></a>
        <div class="meta hide" id="lastUpdate"></div>
      </div>

      <div id="evCards"></div>
      <div class="card hide" id="merCard"><div class="sq-h"><b id="merTitle"></b></div><div id="merList"></div><div class="hint" id="merHint"></div></div>

      <div class="card hide" id="dsCard">
        <div class="sq-h"><b id="dsTitle"></b><span class="tag req" id="dsTeam"></span></div>
        <div class="hint" id="dsMeta" style="margin-top:0"></div>
        <ol id="dsSteps" class="dssteps"></ol>
        <div class="hint" id="dsWith"></div>
      </div>

      <div id="squads"></div>

      <div class="card">
        <div class="sq-h"><b data-t="heroTitle"></b><span class="tag req" data-t="required"></span></div>
        <div><label class="l" for="hero" data-t="heroPower"></label><input id="hero" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="hint" data-t="heroHint"></div>
        <div class="row" style="margin-top:12px">
          <div><label class="l" for="gstage" data-t="gstage"></label><input id="gstage" type="text" inputmode="numeric" autocomplete="off" placeholder="3"></div>
          <div><label class="l" for="gorilla" data-t="gorilla"></label><input id="gorilla" type="text" inputmode="numeric" autocomplete="off" placeholder="23"></div>
        </div>
        <div style="margin-top:10px"><label class="l" for="gpower" data-t="gpower"></label><input id="gpower" type="text" inputmode="numeric" autocomplete="off" placeholder="2355342"></div>
        <div class="hint" data-t="gHint"></div>
      </div>

      <div class="card">
        <div class="sq-h"><label class="l" for="email" data-t="emailTitle" style="margin:0"></label><span class="tag req" data-t="required"></span></div>
        <div id="emailActive" class="ok-pill hide">● <span data-t="emailSaved"></span></div>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
        <div class="hint" data-t="emailHint"></div>
      </div>

      <div class="card hide" id="appRemCard">
        <label class="l" data-t="appRemTitle"></label>
        <label class="chk" style="margin-top:0;color:var(--text)"><input type="checkbox" id="appRem"><span data-t="appRemOn"></span></label>
        <div class="hint" data-t="appRemHint"></div>
        <div class="hint" id="appRemMsg" style="color:var(--warn)"></div>
        <button type="button" id="appRemTest" style="margin-top:10px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer" data-t="appRemTest"></button>
      </div>

      <div class="card hide" id="linksCard">
        <label class="l" data-t="linksTitle"></label>
        <div class="lnk"><div class="hint" data-t="linkPublic"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/" data-t="copy"></button></div></div>
        <div class="lnk hide" id="linkAdminBox"><div class="hint" data-t="linkAdmin"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/admin.html</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/admin.html" data-t="copy"></button></div></div>
      </div>

      <button class="btn" id="save" data-t="save"></button>
      <div class="msg" id="msg"></div>
    </section>

    <!-- Übersicht -->
    <section id="profileView" class="hide">
      <div id="profBox"></div>
    </section>

    <section id="overviewView" class="hide">
      <div class="card">
        <div class="stat"><b id="statTxt"></b><div class="bar"><i id="statBar" style="width:0"></i></div></div>
      </div>
      <div class="card" style="padding:8px 12px">
        <table>
          <thead><tr><th>#</th><th data-t="colName"></th><th class="n">T1</th><th class="n" data-t="total"></th></tr></thead>
          <tbody id="ovBody"></tbody>
        </table>
      </div>
      <div class="card" id="missingCard">
        <label class="l" data-t="missing"></label>
        <div class="chips" id="missingList"></div>
      </div>
    </section>
  </div>
  <p style="text-align:center;margin-top:28px"><a href="admin.html" style="color:var(--muted);font-size:12px;text-decoration:none">🔒 Admin (R4/R5)</a></p>
</div>

  function setMsg(txt, cls){ var m = $('msg'); m.textContent = txt || ''; m.className = 'msg' + (cls ? ' ' + cls : ''); }

  function parsePow(v){
    v = String(v || '').trim().replace(/\s/g,'').replace(/[mM]$/,'');
    if (!v) return null;
    if (/^\d{1,3}([.,]\d{3}){2,}$/.test(v)) v = v.replace(/[.,]/g,'');
    var n = Number(v.replace(',', '.'));
    return isFinite(n) && n > 0 ? n : NaN;
  }

  var NEW_MODE = false;
  function setNewMode(on){
    NEW_MODE = !!on;

    $('newBox').classList.toggle('hide', !NEW_MODE);
    if (NEW_MODE) { $('name').value = ''; loadMember(); $('newName').focus(); }
    else { $('newName').value = ''; }
    setMsg('');

  function collect(){
    var name = NEW_MODE ? $('newName').value.trim().replace(/\s+/g, ' ') : $('name').value;
    if (NEW_MODE) {
      if (name.length < 2 || name.length > 40) return { err: t('errNewName') };
      var hit = DATA.members.filter(function(m){ return m.toLowerCase() === name.toLowerCase(); })[0];
      if (hit) return { err: t('errExists') };
    }
    if (!name) return { err: t('errName') };
    var squads = [];
    for (var i = 0; i < DATA.squads; i++){
      var c = $('sq'+i), type = c.querySelector('.type').value, raw = c.querySelector('.pow').value, p = parsePow(raw);
      if (p !== null && isNaN(p)) return { err: t('errPower') };
      if (i < REQ_SQUADS && (!type || p === null)) return { err: t('errTreq', {n: i+1}) };
      if (!!type !== (p !== null)) return { err: t('errSquad', {n: i+1}) };
      squads.push({ type: type, power: p === null ? null : (p >= 10000 ? Math.round(p / 1e4) / 100 : p) });
    }
    var hero = parsePow($('hero').value);
    if (hero === null || isNaN(hero)) return { err: t('errHero') };
    if (hero >= 10000) hero = Math.round(hero / 1e4) / 100;
    var gtxt = $('gorilla').value.trim(), gor = /^\d{1,3}$/.test(gtxt) ? parseInt(gtxt, 10) : NaN;
    if (!(gor >= 1)) return { err: t('errGorilla') };
    var stxt = $('gstage').value.trim(), gst = /^\d{1,2}$/.test(stxt) ? parseInt(stxt, 10) : NaN;
    if (!(gst >= 1 && gst <= 30)) return { err: t('errGstage') };
    var gpw = parsePow($('gpower').value);
    if (gpw === null || isNaN(gpw)) return { err: t('errGpower') };
    gpw = Math.round(gpw < 10000 ? gpw * 1e6 : gpw);
    if (gpw > 1e9) return { err: t('errGpower') };
    var email = $('email').value.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { err: t('errEmail') };
    var ex = NEW_MODE ? null : DATA.entries[name];
    if (!email && !(ex && ex.hasEmail)) return { err: t('errEmailReq') };
    return { data: { name: name, squads: squads, email: email, removeEmail: false, lang: LANG, hero: hero, gorilla: gor, gstage: gst, gpower: gpw } };
  }

  function errText(m){
    m = String(m || '');
    var sq = m.match(/ERR_SQUAD:(\d)/);
    if (sq) return t('errSquad', {n: sq[1]});
    var tr = m.match(/ERR_TREQ:(\d)/);
    if (tr) return t('errTreq', {n: tr[1]});
    if (m.indexOf('ERR_HERO') >= 0) return t('errHero');
    if (m.indexOf('ERR_GORILLA') >= 0) return t('errGorilla');
    if (m.indexOf('ERR_GSTAGE') >= 0) return t('errGstage');
    if (m.indexOf('ERR_GPOWER') >= 0) return t('errGpower');
    if (m.indexOf('ERR_NEWNAME') >= 0) return t('errNewName');
    if (m.indexOf('ERR_EXISTS') >= 0) return t('errExists');
    if (m.indexOf('ERR_RATE') >= 0) return t('errRate');
    if (m.indexOf('ERR_NAME') >= 0) return t('errName');
    if (m.indexOf('ERR_T1') >= 0) return t('errT1');
    if (m.indexOf('ERR_POWER') >= 0) return t('errPower');
    if (m.indexOf('ERR_EMAIL_TAKEN') >= 0) return t('errEmailTaken');
    if (m.indexOf('ERR_EMAIL_REQ') >= 0) return t('errEmailReq');
    if (m.indexOf('ERR_EMAIL') >= 0) return t('errEmail');
    return t('errSave');
  }

  function save(){
    if (busy) return;
    var r = collect();
    if (r.err) { setMsg(r.err, 'err'); return; }
    busy = true; $('save').disabled = true; $('save').textContent = t('saving'); setMsg('');
    var isNew = NEW_MODE;
    var call = isNew
      ? rpc('register_entry', { p_name: r.data.name, p_squads: r.data.squads, p_email: r.data.email, p_lang: r.data.lang, p_hero: r.data.hero, p_gorilla: r.data.gorilla, p_gstage: r.data.gstage, p_gpower: r.data.gpower })
      : rpc('save_entry', { p_name: r.data.name, p_squads: r.data.squads, p_email: r.data.email, p_remove_email: false, p_lang: r.data.lang, p_hero: r.data.hero, p_gorilla: r.data.gorilla, p_gstage: r.data.gstage, p_gpower: r.data.gpower });
    call
      .then(function(res){
        var nm = (isNew && res.name) || r.data.name;
        if (isNew && DATA.members.indexOf(nm) < 0) DATA.members.push(nm);
        DATA.entries[nm] = { squads: res.squads, hasEmail: res.hasEmail, lang: res.lang, updated: res.updated, hero: res.hero, gorilla: res.gorilla, gstage: res.gstage, gpower: res.gpower };
        done();
        $('email').value = '';

          setNewMode(false); fillNames(); $('name').value = nm;
          store('skws_name', nm);
          if (window.SKWSAndroid && window.SKWSAndroid.setName) { try { window.SKWSAndroid.setName(nm); } catch(e){} }
        }
        fillNames(); showMeta(); renderOverview();
        setMsg(t('saved'), 'ok');
      })
      .catch(function(err){ done(); setMsg(errText(err && err.message), 'err'); });
    function done(){ busy = false; $('save').disabled = false; $('save').textContent = t('save'); }
  }

    });

  /* ---------- Profil: Bienchen, Teufelchen, Erfolge ---------- */
  var PROF_STATS = null, PROF_STK = {}, PROF_BUSY = false;
  var BEE_T = [0, 1, 3, 6, 10, 15], DEV_T = [0, 1, 2, 4, 6];
  var ACH = [
    { id:'melder', ic:'📝', t:[3, 10, 25], v:function(s){ return s.hn || 0; } },
    { id:'growth', ic:'📈', t:[5, 15, 30], v:function(s){ return s.g || 0; } },
    { id:'power', ic:'⚔️', t:[35, 45, 55], v:function(s, e){ return e && e.squads && e.squads[0] ? Number(e.squads[0].power || 0) : 0; } },

    { id:'gorilla', ic:'🦍', t:[5, 10, 15], v:function(s, e){ return e && e.gstage ? Number(e.gstage) : 0; } },
    { id:'ds', ic:'🏜️', t:[1, 5, 15], v:function(s){ return s.pds || 0; } },
    { id:'cs', ic:'🏔️', t:[1, 5, 15], v:function(s){ return s.pcs || 0; } },

    { id:'joker', ic:'🃏', t:[1, 3, 8], v:function(s){ return s.sub || 0; } },
    { id:'bees', ic:'🐝', t:[1, 5, 12], v:function(s){ return s.b || 0; } },
    { id:'loyal', ic:'🛡️', t:[30, 90, 365], v:function(s){ var d = s.jd || s.fe; return d ? Math.floor((Date.now() - new Date(d)) / 86400000) : 0; } },
    { id:'mentor', ic:'🎓', t:[1], v:function(s){ return s.role === 'mentor' || s.role === 'r4' ? 1 : 0; } },
    { id:'clean', ic:'😇', t:[1], v:function(s){ var d = s.jd || s.fe; return !s.d && d && (Date.now() - new Date(d)) >= 30 * 86400000 ? 1 : 0; } },
    { id:'redeemed', ic:'🌅', t:[1], v:function(s){ return s.d > 0 && !s.d90 ? 1 : 0; } }
  ];
  function achTier(a, s, e){ var v = a.v(s || {}, e), t = 0; a.t.forEach(function(x, i){ if (v >= x) t = i + 1; }); return { v: v, t: t }; }
  function loadProfile(){
    var n = $('name').value;
    if (!PROF_STATS && !PROF_BUSY) { PROF_BUSY = true; rpc('profile_stats').then(function(r){ PROF_STATS = r || {}; }).catch(function(){ PROF_STATS = {}; }).then(function(){ PROF_BUSY = false; renderProfile(); }); }
    if (n && !PROF_STK[n]) rpc('player_profile', { p_name: n }).then(function(r){ PROF_STK[n] = (r && r.stickers) || []; renderProfile(); }).catch(function(){ PROF_STK[n] = []; renderProfile(); });
    renderProfile();
  }
  function renderProfile(){
    var box = $('profBox'), T = PROF_I18N[LANG] || PROF_I18N.en, n = $('name').value; box.innerHTML = '';
    function el(tag, cls, txt){ var x = document.createElement(tag); if (cls) x.className = cls; if (txt !== undefined) x.textContent = txt; return x; }
    if (!n) { var c0 = el('div', 'card'); c0.appendChild(el('div', 'hint', T.pickName)); box.appendChild(c0); return; }
    if (!PROF_STATS) { var c1 = el('div', 'card'); c1.appendChild(el('div', 'hint', '…')); box.appendChild(c1); return; }
    var s = PROF_STATS[n] || {}, e = DATA.entries[n], stk = PROF_STK[n] || [];
    var fmtD = function(x){ return new Date(x).toLocaleDateString(LANG, { day:'2-digit', month:'2-digit', year:'numeric' }); };
    // Kopf
    var c = el('div', 'card'), h = el('div', 'prof-h'), lvlB = 0; BEE_T.forEach(function(x, i){ if ((s.b || 0) >= x) lvlB = i; });
    var lvlD = 0; DEV_T.forEach(function(x, i){ if ((s.d90 || 0) >= x) lvlD = i; });
    h.appendChild(el('div', 'prof-av', lvlD >= 2 ? '😈' : lvlB >= 1 ? '🐝' : '🙂'));
    var hn = el('div'); hn.appendChild(el('b', '', n));
    var sub = []; if (s.jd || s.fe) sub.push(T.since.replace('{d}', fmtD(s.jd || s.fe))); if (s.role) sub.push(T.role[s.role]);
    hn.appendChild(el('div', 'hint', sub.join(' · '))); h.appendChild(hn); c.appendChild(h);
    var lv = el('div', 'lvl');
    function lvlBox(title, icon, count, idx, th, names, col){
      var d = el('div'); d.appendChild(el('div', 'hint', title)); var big = el('div', 'big'); big.appendChild(el('span', '', icon + ' ' + count)); d.appendChild(big);
      d.appendChild(el('div', '', names[idx]));
      var bar = el('div', 'bar'), i = el('i'); var nx = th[idx + 1];
      i.style.width = (nx === undefined ? 100 : Math.round((count - th[idx]) / (nx - th[idx]) * 100)) + '%'; i.style.background = col; bar.appendChild(i); d.appendChild(bar);
      d.appendChild(el('div', 'hint', nx === undefined ? T.maxed : T.next.replace('{n}', nx - count).replace('{lvl}', names[idx + 1])));
      return d;
    }
    lv.appendChild(lvlBox(T.beeLevel, '🐝', s.b || 0, lvlB, BEE_T, T.beeL, '#f5c518'));
    var dv = lvlBox(T.devilLevel, '😈', s.d90 || 0, lvlD, DEV_T, T.devL, '#ff6b6b'); if (!lvlD) dv.lastChild.textContent = '😇';
    lv.appendChild(dv); c.appendChild(lv); box.appendChild(c);
    // Sticker-Wand
    var c2 = el('div', 'card'), hd = el('div', 'sq-h'); hd.appendChild(el('b', '', T.stickers)); hd.appendChild(el('span', 'tag', '🐝 ' + (s.b || 0) + '  ·  😈 ' + (s.d || 0))); c2.appendChild(hd);
    var info = el('div', 'hint');
    if (!stk.length) c2.appendChild(el('div', 'hint', T.noStickers));
    else {
      var w = el('div', 'stk');
      stk.forEach(function(x){
        var old = x.kind === 'malus' && (Date.now() - new Date(x.t)) > 90 * 86400000;
        var sp = el('span', (x.kind === 'bonus' ? 'b' : 'd') + (old ? ' old' : ''), x.kind === 'bonus' ? '🐝' : '😈');

      var r = achTier(a, s, e), tx = T.a[a.id], multi = a.t.length > 1;
      var card = el('div', 'achv ' + (r.t ? 't' + (multi ? r.t : 3) : 'lock'));

        var bar = el('div', 'bar'), i = el('i'); i.style.width = Math.min(100, Math.round(r.v / goal * 100)) + '%'; bar.appendChild(i); card.appendChild(bar);
        card.appendChild(el('small', '', (Math.round(r.v * 10) / 10) + ' / ' + goal + (r.t ? ' → ' + T.tiers[r.t] : '')));
      }
      if (r.t && multi) card.appendChild(el('small', '', T.tiers[r.t - 1]));

    applyLang();
    $('loading').classList.add('hide'); $('app').classList.remove('hide');

    ls.addEventListener('change', function(){ setLang(this.value, true); });
    $('search').addEventListener('input', fillNames);
    $('name').addEventListener('change', function(){ store('skws_name', this.value); if (window.SKWSAndroid && window.SKWSAndroid.setName) { try { window.SKWSAndroid.setName(this.value); } catch(e){} } loadMember(); });
    $('save').addEventListener('click', save);
    $('newBtn').addEventListener('click', function(){ setNewMode(true); });
    $('backBtn').addEventListener('click', function(){ setNewMode(false); });
    $('tabForm').addEventListener('click', function(){ showTab('form'); });
    $('tabOverview').addEventListener('click', function(){ showTab('overview'); });
    $('tabProfile').addEventListener('click', function(){ showTab('profile'); });

    setupRem();
    setupLinks();
    var last = store('skws_name');
    if (last && DATA.members.indexOf(last) >= 0){ $('name').value = last; loadMember(); }
  }

  var nl = (navigator.language || 'en').slice(0,2);
  $('loadingTxt').textContent = ({de:'Lade…',fr:'Chargement…',es:'Cargando…',pt:'Carregando…',it:'Caricamento…',tr:'Yükleniyor…',ru:'Загрузка…',pl:'Ładowanie…'})[nl] || 'Loading…';

  var qs = new URLSearchParams(location.search);
  if (qs.get('unsub')) {
    var ul = I18N[qs.get('lang')] ? qs.get('lang') : (I18N[nl] ? nl : 'en');
    rpc('unsubscribe', { p_token: qs.get('unsub') })
      .then(function(ok){ $('loadingTxt').textContent = ok ? I18N[ul].unsubDone : I18N[ul].unsubFail; })
      .catch(function(){ $('loadingTxt').textContent = I18N[ul].unsubFail; });
    document.querySelector('#loading .spin').style.display = 'none';
    return;
  }
  rpc('get_init')
    .then(function(res){
      init({ alliance: ALLIANCE, members: res.members || [], leaders: res.leaders || [], entries: res.entries || {}, ds: res.ds || null, ev: res.ev || null,
             troops: ['tank','missile','aircraft','mixed'], squads: 4, langs: LANG_NAMES, i18n: I18N });
    })
    .catch(function(){ $('loadingTxt').textContent = 'Error – please reload / Fehler – bitte neu laden'; });
})();
</script>
</body>
</html>
