<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKWS – Skywalkers · Squads</title>
<meta name="theme-color" content="#070b14">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#070b14; --bg2:#0d1424; --card:#111a2e; --line:#1f2b45; --text:#e6edf7; --muted:#8a9bb8;
    --accent:#5cc8ff; --accent2:#7c5cff; --ok:#3ddc97; --err:#ff6b6b;
    --tank:#3987e5; --missile:#d95926; --aircraft:#9085e9; --mixed:#199e70;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{background:radial-gradient(1200px 500px at 50% -200px,#1a2a55 0%,transparent 70%),var(--bg);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:11px;letter-spacing:.02em;color:#06101f}
  .htxt{flex:1;min-width:0}
  .htxt .a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .htxt h1{margin:0;font-size:20px;font-weight:700}
  select,input{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,200,255,.15)}
  #lang{width:auto;padding:8px 30px 8px 10px;font-size:13px}
  .tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .intro{color:var(--muted);margin:0 0 12px}
  label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sq-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sq-h b{font-size:16px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .tag.req{border-color:rgba(92,200,255,.5);color:var(--accent)}
  .sq.opt{opacity:.92}
  .sq[data-type="tank"]{border-left:3px solid var(--tank)}
  .sq[data-type="missile"]{border-left:3px solid var(--missile)}
  .sq[data-type="aircraft"]{border-left:3px solid var(--aircraft)}
  .sq[data-type="mixed"]{border-left:3px solid var(--mixed)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .lnk{margin-top:8px}
  .lnkrow{display:flex;gap:8px;align-items:center;margin-top:4px}
  .lnkrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .cpy{flex:none;background:var(--bg2);border:1px solid rgba(92,200,255,.45);color:var(--accent);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .dssteps{margin:8px 0 0;padding-left:20px}
  .dssteps li{margin:6px 0}
  .dssteps li b{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .linkbtn{display:block;width:100%;margin-top:10px;background:var(--bg2);border:1px dashed var(--line);color:var(--accent);border-radius:10px;padding:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .meta{font-size:13px;color:var(--muted);margin:8px 0 0}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
  .chk input{width:18px;height:18px;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto}
  .ok-pill{display:inline-block;font-size:12px;color:var(--ok);margin-bottom:8px}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:#06101f;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{min-height:22px;margin-top:10px;text-align:center;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .hide{display:none!important}
  .stat{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .typ{font-size:12px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SKWS</div>
    <div class="htxt"><div class="a" id="allianceName">SKWS – Skywalkers</div><h1 data-t="title">Squads</h1></div>
    <select id="lang" aria-label="Language"></select>
  </header>

  <div id="loading" class="loading"><div class="spin"></div><span id="loadingTxt">…</span></div>

  <div id="app" class="hide">
    <div class="tabs">
      <button id="tabForm" class="on" data-t="form"></button>
      <button id="tabOverview" data-t="overview"></button>
    </div>

    <!-- Formular -->
    <section id="formView">
      <div class="card">
        <p class="intro" data-t="intro"></p>
        <label class="l" for="name" data-t="name"></label>
        <div id="pickBox">
          <input id="search" type="search" data-tp="search" autocomplete="off" style="margin-bottom:8px">
          <select id="name"></select>
          <div class="hint hide" id="nameSaved" style="color:var(--ok)">✓ <span data-t="nameSaved"></span></div>
          <div class="hint" data-t="notListed"></div>
          <button type="button" id="newBtn" class="linkbtn" data-t="newBtn"></button>
        </div>
        <div id="newBox" class="hide">
          <input id="newName" type="text" maxlength="40" autocomplete="off" data-tp="newName">
          <div class="hint" data-t="newNameHint"></div>
          <button type="button" id="backBtn" class="linkbtn" data-t="backToList"></button>
        </div>
        <a href="admin.html" id="adminBtn" class="hide" style="display:block;margin-top:10px;text-align:center;border:1px solid rgba(92,200,255,.45);color:var(--accent);border-radius:10px;padding:10px;text-decoration:none;font-weight:600;font-size:14px">🔒 <span data-t="adminBtn"></span></a>
        <div class="meta hide" id="lastUpdate"></div>
      </div>

      <div class="card hide" id="dsCard">
        <div class="sq-h"><b id="dsTitle"></b><span class="tag req" id="dsTeam"></span></div>
        <div class="hint" id="dsMeta" style="margin-top:0"></div>
        <ol id="dsSteps" class="dssteps"></ol>
        <div class="hint" id="dsWith"></div>
      </div>

      <div id="squads"></div>

      <div class="card">
        <div class="sq-h"><b data-t="heroTitle"></b><span class="tag req" data-t="required"></span></div>
        <div><label class="l" for="hero" data-t="heroPower"></label><input id="hero" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="hint" data-t="heroHint"></div>
        <div class="row" style="margin-top:12px">
          <div><label class="l" for="gstage" data-t="gstage"></label><input id="gstage" type="text" inputmode="numeric" autocomplete="off" placeholder="3"></div>
          <div><label class="l" for="gorilla" data-t="gorilla"></label><input id="gorilla" type="text" inputmode="numeric" autocomplete="off" placeholder="23"></div>
        </div>
        <div style="margin-top:10px"><label class="l" for="gpower" data-t="gpower"></label><input id="gpower" type="text" inputmode="numeric" autocomplete="off" placeholder="2355342"></div>
        <div class="hint" data-t="gHint"></div>
      </div>

      <div class="card">
        <div class="sq-h"><label class="l" for="email" data-t="emailTitle" style="margin:0"></label><span class="tag req" data-t="required"></span></div>
        <div id="emailActive" class="ok-pill hide">● <span data-t="emailSaved"></span></div>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
        <div class="hint" data-t="emailHint"></div>
      </div>

      <div class="card hide" id="appRemCard">
        <label class="l" data-t="appRemTitle"></label>
        <label class="chk" style="margin-top:0;color:var(--text)"><input type="checkbox" id="appRem"><span data-t="appRemOn"></span></label>
        <div class="hint" data-t="appRemHint"></div>
        <div class="hint" id="appRemMsg" style="color:var(--warn)"></div>
        <button type="button" id="appRemTest" style="margin-top:10px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer" data-t="appRemTest"></button>
      </div>

      <div class="card hide" id="linksCard">
        <label class="l" data-t="linksTitle"></label>
        <div class="lnk"><div class="hint" data-t="linkPublic"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/" data-t="copy"></button></div></div>
        <div class="lnk hide" id="linkAdminBox"><div class="hint" data-t="linkAdmin"></div>
          <div class="lnkrow"><code>https://matdan1987.github.io/skws-squads/admin.html</code><button type="button" class="cpy" data-url="https://matdan1987.github.io/skws-squads/admin.html" data-t="copy"></button></div></div>
      </div>

      <button class="btn" id="save" data-t="save"></button>
      <div class="msg" id="msg"></div>
    </section>

    <!-- Übersicht -->
    <section id="overviewView" class="hide">
      <div class="card">
        <div class="stat"><b id="statTxt"></b><div class="bar"><i id="statBar" style="width:0"></i></div></div>
      </div>
      <div class="card" style="padding:8px 12px">
        <table>
          <thead><tr><th>#</th><th data-t="colName"></th><th class="n">T1</th><th class="n" data-t="total"></th></tr></thead>
          <tbody id="ovBody"></tbody>
        </table>
      </div>
      <div class="card" id="missingCard">
        <label class="l" data-t="missing"></label>
        <div class="chips" id="missingList"></div>
      </div>
    </section>
  </div>
  <p style="text-align:center;margin-top:28px"><a href="admin.html" style="color:var(--muted);font-size:12px;text-decoration:none">🔒 Admin (R4/R5)</a></p>
</div>

        if (isNew) {
          setNewMode(false); fillNames(); $('name').value = nm;
          store('skws_name', nm);
          if (window.SKWSAndroid && window.SKWSAndroid.setName) { try { window.SKWSAndroid.setName(nm); } catch(e){} }
        }
        fillNames(); showMeta(); renderOverview();
        setMsg(t('saved'), 'ok');
      })
      .catch(function(err){ done(); setMsg(errText(err && err.message), 'err'); });
    function done(){ busy = false; $('save').disabled = false; $('save').textContent = t('save'); }
  }

  /* ---------- Übersicht ---------- */
  function renderOverview(){
    if (!DATA) return;
    var members = DATA.members, rows = [], missing = [];
    members.forEach(function(n){
      var e = DATA.entries[n];
      if (!e) { missing.push(n); return; }
      var total = 0; e.squads.forEach(function(s){ if (s.power) total += Number(s.power); });
      rows.push({ name: n, t1: e.squads[0] || {}, total: total, hero: e.hero, gorilla: e.gorilla, gstage: e.gstage, gpower: e.gpower });
    });
    rows.sort(function(a,b){ return (b.t1.power||0) - (a.t1.power||0); });
    var x = members.length - missing.length, y = members.length;
    $('statTxt').textContent = t('submitted', {x: x, y: y});
    $('statBar').style.width = (y ? Math.round(x / y * 100) : 0) + '%';

    var tb = $('ovBody'); tb.innerHTML = '';
    rows.forEach(function(r, i){
      var tr = document.createElement('tr');
      var td0 = document.createElement('td'); td0.textContent = i + 1; td0.className = 'typ';
      var td1 = document.createElement('td'); td1.textContent = r.name;
      if (r.hero || r.gorilla) {
        var hs = document.createElement('div'); hs.className = 'typ';
        var g = [r.gstage ? '★' + r.gstage : '', r.gorilla ? 'Lv ' + r.gorilla : '', r.gpower ? fmtPow(Math.round(r.gpower / 1e4) / 100) : ''].filter(Boolean).join(' ');
        hs.textContent = [r.hero ? t('heroShort') + ' ' + fmtPow(r.hero) : '', g ? '🦍 ' + g : ''].filter(Boolean).join(' · ');
        td1.appendChild(hs);
      }
      var td2 = document.createElement('td'); td2.className = 'n';
      var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = COLORS[r.t1.type] || 'var(--mixed)';
      dot.title = r.t1.type ? t(r.t1.type) : '';
      td2.appendChild(dot); td2.appendChild(document.createTextNode(fmtPow(r.t1.power)));
      var sub = document.createElement('div'); sub.className = 'typ'; sub.textContent = r.t1.type ? t(r.t1.type) : '';
      td2.appendChild(sub);
      var td3 = document.createElement('td'); td3.className = 'n'; td3.textContent = fmtPow(r.total);
      tr.appendChild(td0); tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      tb.appendChild(tr);
    });

    $('missingCard').classList.toggle('hide', !missing.length);
    var ml = $('missingList'); ml.innerHTML = '';
    missing.sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }).forEach(function(n){
      var s = document.createElement('span'); s.textContent = n; ml.appendChild(s);
    });
  }

  function showTab(which){
    $('tabForm').classList.toggle('on', which === 'form');
    $('tabOverview').classList.toggle('on', which !== 'form');
    $('formView').classList.toggle('hide', which !== 'form');
    $('overviewView').classList.toggle('hide', which === 'form');
  }

  /* ---------- Sprache ---------- */
  function setLang(l, manual){
    if (!DATA.i18n[l]) l = 'en';
    LANG = l; $('lang').value = l; store('skws_lang', l);
    if (manual) store('skws_lang_manual', '1');
    applyLang();
  }

  function pickLang(){
    var saved = store('skws_lang');
    if (saved && DATA.i18n[saved]) return saved;
    var nav = (navigator.languages || [navigator.language || 'en']);
    for (var i = 0; i < nav.length; i++){ var c = String(nav[i]).slice(0,2).toLowerCase(); if (DATA.i18n[c]) return c; }
    return 'en';
  }

  /* ---------- Handy-Erinnerung (nur in der Android-App) ---------- */
  var APP = window.SKWSAndroid && window.SKWSAndroid.getReminder ? window.SKWSAndroid : null;
  function remState(){ try { return JSON.parse(APP.getReminder()); } catch(e){ return {}; } }
  function showRem(){
    if (!APP) return;
    var st = remState(), msg = '';
    $('appRemCard').classList.remove('hide');
    $('appRem').checked = !!st.on;
    if (st.on && !st.perm) msg = t('appRemNoPerm');
    $('appRemMsg').textContent = msg;
  }
  function setupLinks(){
    if (!window.SKWSAndroid) return;
    $('linksCard').classList.remove('hide');
    var btns = document.querySelectorAll('#linksCard .cpy');
    for (var i = 0; i < btns.length; i++) btns[i].addEventListener('click', function(){
      var b = this, url = b.dataset.url;
      function ok(){ b.textContent = t('copied'); setTimeout(function(){ b.textContent = t('copy'); }, 2000); }
      if (window.SKWSAndroid.copy) { try { window.SKWSAndroid.copy(url); ok(); return; } catch(e){} }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function(){});
    });
  }
  function setupRem(){
    if (!APP) return;
    showRem();
    $('appRem').addEventListener('change', function(){
      var n = $('name').value;
      if (this.checked && !n) { this.checked = false; $('appRemMsg').textContent = t('appRemPickName'); return; }
      $('appRemMsg').textContent = '';
      APP.setReminder(this.checked, n);
      setTimeout(showRem, 1500); setTimeout(showRem, 5000);
    });
    $('appRemTest').addEventListener('click', function(){ APP.testNotification($('name').value || ''); setTimeout(showRem, 1500); });
    $('name').addEventListener('change', function(){ var st = remState(); if (st.on && this.value) APP.setReminder(true, this.value); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) showRem(); });
  }

  /* ---------- Start ---------- */
  function init(data){
    DATA = data;
    $('allianceName').textContent = DATA.alliance;
    var ls = $('lang');
    Object.keys(DATA.langs).forEach(function(k){
      var o = document.createElement('option'); o.value = k; o.textContent = DATA.langs[k]; ls.appendChild(o);
    });
    buildSquads();
    LANG = pickLang(); ls.value = LANG;
    applyLang();
    $('loading').classList.add('hide'); $('app').classList.remove('hide');

    ls.addEventListener('change', function(){ setLang(this.value, true); });
    $('search').addEventListener('input', fillNames);
    $('name').addEventListener('change', function(){ store('skws_name', this.value); if (window.SKWSAndroid && window.SKWSAndroid.setName) { try { window.SKWSAndroid.setName(this.value); } catch(e){} } loadMember(); });
    $('save').addEventListener('click', save);
    $('newBtn').addEventListener('click', function(){ setNewMode(true); });
    $('backBtn').addEventListener('click', function(){ setNewMode(false); });
    $('tabForm').addEventListener('click', function(){ showTab('form'); });
    $('tabOverview').addEventListener('click', function(){ showTab('overview'); });

    setupRem();
    setupLinks();
    var last = store('skws_name');
    if (last && DATA.members.indexOf(last) >= 0){ $('name').value = last; loadMember(); }
  }

  var nl = (navigator.language || 'en').slice(0,2);
  $('loadingTxt').textContent = ({de:'Lade…',fr:'Chargement…',es:'Cargando…',pt:'Carregando…',it:'Caricamento…',tr:'Yükleniyor…',ru:'Загрузка…',pl:'Ładowanie…'})[nl] || 'Loading…';

  var qs = new URLSearchParams(location.search);
  if (qs.get('unsub')) {
    var ul = I18N[qs.get('lang')] ? qs.get('lang') : (I18N[nl] ? nl : 'en');
    rpc('unsubscribe', { p_token: qs.get('unsub') })
      .then(function(ok){ $('loadingTxt').textContent = ok ? I18N[ul].unsubDone : I18N[ul].unsubFail; })
      .catch(function(){ $('loadingTxt').textContent = I18N[ul].unsubFail; });
    document.querySelector('#loading .spin').style.display = 'none';
    return;
  }
  rpc('get_init')
    .then(function(res){
      init({ alliance: ALLIANCE, members: res.members || [], leaders: res.leaders || [], entries: res.entries || {}, ds: res.ds || null,
             troops: ['tank','missile','aircraft','mixed'], squads: 4, langs: LANG_NAMES, i18n: I18N });
    })
    .catch(function(){ $('loadingTxt').textContent = 'Error – please reload / Fehler – bitte neu laden'; });
})();
</script>
</body>
</html>
